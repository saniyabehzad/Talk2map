<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk2Map Zurich Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: three working panes — conversation & criteria | map | results. Swiss cartographic: cool greys, tram blue. */
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #15212c;
  --muted: #5b6a78;
  --line: #dbe1e7;
  --accent: #1a56db;
  --accent-soft: #dfe8fc;
  --good: #1d7f48;
  --warn: #a8681a;
  --bad: #b8352a;
  --map-land: #ecefe9;
  --map-water: #b9d3e8;
  --map-boundary: #2f3e4b;
  --map-road: #c3c8cd;
  --map-rail: #6f7b86;
  --map-label: #44525e;
  --paper: #fbfcfd;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --panel: #151e27; --ink: #e5ecf2; --muted: #93a3b2; --line: #263340;
    --accent: #6b9bff; --accent-soft: #1b2b49; --good: #4cc282; --warn: #e3a54d; --bad: #f07a6e;
    --map-land: #1a232b; --map-water: #1c3a53; --map-boundary: #a9bccc; --map-road: #34414d;
    --map-rail: #7c8a96; --map-label: #a7b6c3; --paper: #1b242d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --panel: #151e27; --ink: #e5ecf2; --muted: #93a3b2; --line: #263340;
  --accent: #6b9bff; --accent-soft: #1b2b49; --good: #4cc282; --warn: #e3a54d; --bad: #f07a6e;
  --map-land: #1a232b; --map-water: #1c3a53; --map-boundary: #a9bccc; --map-road: #34414d;
  --map-rail: #7c8a96; --map-label: #a7b6c3; --paper: #1b242d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 7px; top: 4px; width: 8px; height: 8px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.brand small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.header-spacer { flex: 1; }

main { min-height: 0; display: grid; grid-template-columns: 350px minmax(0, 1fr) 400px; }
.pane { min-height: 0; overflow: auto; }
.left { border-right: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.right { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
section h2 { font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.anchors { display: grid; gap: 6px; }
.anchor { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; }
.anchor-tag { width: 24px; height: 24px; border-radius: 5px; background: var(--ink); color: var(--panel); font: 700 12px var(--display); display: grid; place-items: center; }
.anchor b { font-weight: 600; display: block; line-height: 1.2; }
.anchor span { color: var(--muted); font-size: 12px; }
.anchor .freq { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }

.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { padding: 9px 11px; border-radius: 10px; max-width: 94%; font-size: 13.5px; }
.msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
.msg.agent { background: var(--bg); align-self: flex-start; border-bottom-left-radius: 3px; }
.msg.agent ul { margin: 6px 0 0; padding-left: 18px; }
.composer { display: flex; gap: 6px; }
.composer input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 11px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.suggest button:hover { color: var(--accent); border-color: var(--accent); }

.crit { display: grid; gap: 10px; }
.crit-row label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.crit-row output { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.crit-row input[type=range] { width: 100%; accent-color: var(--accent); }
.crit-row.toggle label { align-items: center; justify-content: flex-start; cursor: pointer; }
.crit-row .hit { font-size: 11.5px; color: var(--muted); }
.crit-row.flash output { animation: flash 0.9s ease; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

.trace { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.trace li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 6px 4px; border-radius: 6px; font-size: 13px; }
.trace .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--good); }
.trace li.warn .dot { background: var(--warn); }
.trace li.running .dot { background: var(--accent); animation: pulse 0.6s infinite alternate; }
@keyframes pulse { to { opacity: 0.3; } }
.trace b { font-weight: 600; }
.trace span { color: var(--muted); display: block; font-size: 12px; }
details.sql summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
pre.sql { font: 11.5px/1.5 var(--mono); background: var(--bg); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0 0; white-space: pre; }

.mapwrap { position: relative; min-height: 420px; background: var(--map-land); }
#map { position: absolute; inset: 0; display: block; cursor: crosshair; }
.layers { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); padding: 4px; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,0.08); max-width: calc(100% - 24px); }
.layers button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.layers button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: grid; gap: 5px; max-width: 280px; }
.legend .ramp { height: 8px; border-radius: 4px; width: 200px; }
.legend .ends { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.legend .row { display: flex; align-items: center; gap: 6px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.maptag { position: absolute; right: 12px; bottom: 12px; font-size: 11.5px; color: var(--muted); background: var(--panel); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.14); min-width: 190px; display: none; z-index: 5; }
.tip b { font-weight: 600; }
.tip table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tip td { padding: 1px 0; }
.tip td + td { padding-left: 12px; text-align: right; font-family: var(--mono); }

.res-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.res-head .count { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.res-head .sub { color: var(--muted); font-size: 12.5px; }
.critic { margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 9%, var(--panel)); font-size: 13px; display: grid; gap: 8px; }
.critic.ok { border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 7%, var(--panel)); }
.list { padding: 12px 16px 24px; display: grid; gap: 10px; }
.list h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; font-family: var(--display); }
.card { display: grid; grid-template-columns: 128px 1fr; gap: 12px; text-align: left; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); cursor: pointer; }
.card:hover, .card.hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card img { width: 128px; height: 100px; object-fit: cover; border-radius: 8px; display: block; background: var(--bg); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.price { font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
.card .title { font-weight: 600; font-size: 13px; }
.card .addr { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-size: 11.5px; font-family: var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--bg); font-variant-numeric: tabular-nums; }
.chip.fail { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.week { font-size: 12px; margin-top: 4px; color: var(--accent); font-weight: 600; }

.detail { padding: 14px 16px 28px; display: grid; gap: 14px; }
.detail .back { justify-self: start; }
.gallery img.main { width: 100%; aspect-ratio: 760 / 460; border-radius: 12px; display: block; object-fit: cover; background: var(--bg); }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.thumbs button { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; background: none; position: relative; }
.thumbs button[aria-pressed="true"] { border-color: var(--accent); }
.thumbs img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.thumbs span { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; background: rgba(0,0,0,0.55); color: #fff; padding: 1px 5px; border-radius: 4px; }
.d-title { display: grid; gap: 2px; }
.d-title h2 { font-family: var(--display); font-size: 20px; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.d-title .addr { color: var(--muted); }
.why { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.group h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-family: var(--display); }
.metric { display: grid; grid-template-columns: 1fr auto 64px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.metric .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; }
.state { font-size: 11px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 4px; }
.state.ok { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.state.no { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.state.info { color: var(--muted); background: var(--bg); }
.foot { font-size: 11.5px; color: var(--muted); }

@media (max-width: 1180px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .app { height: auto; }
  html, body { height: auto; }
  .pane { overflow: visible; }
  .left, .right { border: 0; }
  .mapwrap { height: 62vh; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Talk2Map <small>Zurich home finder</small></div>
    <span class="pill warn">Demo · synthetic data · schematic map</span>
    <div class="header-spacer"></div>
    <span class="pill" id="scopePill">Zürich + 14 neighbouring municipalities</span>
  </header>
  <main>
    <aside class="pane left" aria-label="Conversation and criteria">
      <section>
        <h2>Your places</h2>
        <div class="anchors" id="anchors"></div>
      </section>
      <section>
        <h2>Conversation</h2>
        <div class="chat" id="chat"></div>
        <form class="composer" id="composer" style="margin-top:8px">
          <input id="ask" autocomplete="off" placeholder="e.g. quieter, max 30 min to Work B, under 3500" aria-label="Ask Talk2Map">
          <button class="btn primary" type="submit">Send</button>
        </form>
        <div class="suggest" id="suggest" style="margin-top:8px"></div>
      </section>
      <section>
        <h2>Criteria I'm using</h2>
        <div class="crit" id="crit"></div>
      </section>
      <section>
        <h2>Agent steps</h2>
        <ol class="trace" id="trace"></ol>
        <details class="sql"><summary>Show generated SQL</summary><pre class="sql" id="sql"></pre></details>
      </section>
    </aside>

    <section class="mapwrap" aria-label="Map">
      <canvas id="map" aria-label="Schematic map of Zurich with matching areas and listings" role="img"></canvas>
      <div class="layers" id="layers" role="group" aria-label="Map layer"></div>
      <div class="legend" id="legend"></div>
      <div class="maptag">Schematic, not to scale</div>
      <div class="tip" id="tip"></div>
    </section>

    <aside class="pane right" aria-label="Results">
      <div id="results"></div>
    </aside>
  </main>
</div>
<script src="model.js"></script>
<script src="pictures.js"></script>
<script src="app.js"></script>
</body>
</html>
